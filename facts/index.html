<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#EAF9FC">
  <meta name="description" content="A hand-picked collection of fun facts about maths, computing, algorithms, logic, puzzles and technology history.">
  <title>Fun Facts | EnigmaPath</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="ep-topbar">
    <a class="ep-brand" href="../index.html" aria-label="EnigmaPath home">
      <svg class="ep-brand__mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 46 L26 26 L36 38 L52 14" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="46" r="5" fill="#4682B4"/><circle cx="52" cy="14" r="5" fill="#1E3D56"/></svg>
      <span>EnigmaPath<small>Fun facts</small></span>
    </a>
  </header>

  <main class="ep-main">
    <div class="facts-head">
      <p class="eyebrow">Curiosity corner</p>
      <h1>Fun Facts</h1>
      <p class="muted">One surprising idea at a time, from ancient puzzles to modern computing. Follow the source to dig deeper.</p>
    </div>

    <article class="card fact-card" id="fact-card" aria-live="polite">
      <span class="badge fact-topic" id="fact-topic">Maths</span>
      <h2 id="fact-title"></h2>
      <p class="fact-hook" id="fact-text"></p>
      <p class="fact-detail" id="fact-detail"></p>
      <a class="fact-source" id="fact-source" href="#" target="_blank" rel="noopener">
        <span id="fact-source-name">Source</span><span aria-hidden="true"> ↗</span>
      </a>
    </article>

    <div class="fact-actions">
      <button type="button" class="btn btn--primary" id="btn-another">Another fact</button>
      <a class="btn" href="../index.html">Back to EnigmaPath</a>
    </div>
    <p class="hint fact-count" id="fact-count"></p>
    <p class="hint fact-tip">Tip: press the right arrow key for another fact.</p>
  </main>

  <noscript>
    <div class="noscript">Fun Facts needs JavaScript. Enable it and reload the page.</div>
  </noscript>

  <script src="../shared/fun-facts.js"></script>
  <script src="js/app.js"></script>
  <script src="../shared/footer.js"></script>
</body>
</html>
